markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "" }  # the picture a shared link shows (the planet's first frame), unless a page has its own
    values: { image: /assets/images/share.jpg }
  - scope: { path: apps }  # the private app, and where it used to be: not for search engines
    values: { sitemap: false }
  - scope: { path: recipe_tracker }
    values: { sitemap: false }

include:
  - .sqlfluff

exclude:
  - CLAUDE.md
  - README.md
  - Makefile
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
  - tools
  - supabase
  - proxy
  - docs
  - package.json
  - package-lock.json
  - node_modules
  # the sources tools/build-js.mjs bundles into assets/js/dist/
  - assets/js/site.js
  - assets/js/holidays.js
  - assets/js/world
  - assets/js/apps
  - assets/js/mcp-app
