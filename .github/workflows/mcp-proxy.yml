# mcp.stevenpisani.com, SJPJr's (the MCP server's) own address (proxy/_worker.js, docs/apps.md):
# deploys the proxy to Cloudflare Pages on a merge that changes it, and makes sure the project
# and its custom domain exist. Needs the CLOUDFLARE_API_TOKEN (Pages: Edit) and
# CLOUDFLARE_ACCOUNT_ID repo secrets; without them the job says so and passes. The DNS record is
# Steve's, once, at Bluehost: each run ends by saying exactly which CNAME to add (mcp → the
# project's pages.dev address) and whether Cloudflare sees it yet.
name: MCP address

on:
  push:
    branches: [main]
    paths: [proxy/**, .github/workflows/mcp-proxy.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: sjpjr-mcp
      DOMAIN: mcp.stevenpisani.com
    steps:
      - name: Token?
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::No CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret, so the proxy wasn't deployed."
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok
        with:
          node-version: 22
      - name: Deploy
        if: steps.token.outputs.ok
        run: |
          url=$(sed -n '/^supabase:/,/^[^ ]/s/^  url: *//p' _config.yml)
          [ -n "$url" ] || { echo "::error::No supabase.url in _config.yml"; exit 1; }
          sed -i "s|__SUPABASE_URL__|$url|" proxy/_worker.js
          npx --yes wrangler@4.147.0 pages project create "$PROJECT" --production-branch main 2>/dev/null || true
          npx --yes wrangler@4.147.0 pages deploy proxy --project-name "$PROJECT" --branch main --commit-dirty=true
      - name: Custom domain
        if: steps.token.outputs.ok
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains"
          code=$(curl -s -o /tmp/d.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$DOMAIN")
          if [ "$code" != 200 ]; then
            curl -s -o /dev/null -w 'domain added: %{http_code}\n' -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' -d "{\"name\":\"$DOMAIN\"}" "$api"
          fi
          # what to do at Bluehost, and how far along it is, in the run's summary
          sub=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log((JSON.parse(s).result||{}).subdomain||""))')
          status=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$DOMAIN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log((JSON.parse(s).result||{}).status||"unknown"))')
          {
            echo "### mcp.stevenpisani.com"
            echo "At Bluehost (Domains → DNS for stevenpisani.com), one record: **CNAME**, host **mcp**, points to **${sub:-the pages.dev address in the Deploy step}**."
            echo "Cloudflare sees the domain as: **$status** (active: live; pending: still waiting for the record or the certificate)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "CNAME mcp -> $sub; $DOMAIN: $status"
