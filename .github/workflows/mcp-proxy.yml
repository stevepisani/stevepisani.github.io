# mcp.stevenpisani.com, the wardrobe MCP server's own address (proxy/_worker.js, docs/apps.md):
# deploys the proxy to Cloudflare Pages on a merge that changes it, and makes sure the project
# and its custom domain exist. Needs the CLOUDFLARE_API_TOKEN (Pages: Edit) and
# CLOUDFLARE_ACCOUNT_ID repo secrets; without them the job says so and passes. The DNS record is
# Steve's, once, at Bluehost: CNAME mcp → wardrobe-mcp.pages.dev.
name: MCP address

on:
  push:
    branches: [main]
    paths: [proxy/**, .github/workflows/mcp-proxy.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: wardrobe-mcp
      DOMAIN: mcp.stevenpisani.com
    steps:
      - name: Token?
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::No CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret, so the proxy wasn't deployed."
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok
        with:
          node-version: 22
      - name: Deploy
        if: steps.token.outputs.ok
        run: |
          url=$(sed -n '/^supabase:/,/^[^ ]/s/^  url: *//p' _config.yml)
          [ -n "$url" ] || { echo "::error::No supabase.url in _config.yml"; exit 1; }
          sed -i "s|__SUPABASE_URL__|$url|" proxy/_worker.js
          npx --yes wrangler@4.147.0 pages project create "$PROJECT" --production-branch main 2>/dev/null || true
          npx --yes wrangler@4.147.0 pages deploy proxy --project-name "$PROJECT" --branch main --commit-dirty=true
      - name: Custom domain
        if: steps.token.outputs.ok
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains"
          code=$(curl -s -o /tmp/d.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$DOMAIN")
          if [ "$code" != 200 ]; then
            curl -s -o /dev/null -w 'domain added: %{http_code}\n' -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' -d "{\"name\":\"$DOMAIN\"}" "$api"
          fi
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$DOMAIN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).result||{};console.log(`${process.env.DOMAIN}: ${r.status||"unknown"}`)})'
