# Builds the site and publishes it to GitHub Pages: the scripts bundled and minified
# (npm run build, tools/build-js.mjs), then Jekyll, then a check that every internal link and
# asset is there (tools/check-site.mjs), then the wardrobe's migrations and MCP server are tested on
# the real schema (tools/wardrobe-test.mjs, PGlite), then the smoke test drives the built site in a real
# browser (tools/smoke.mjs: every page, the planet on desktop and phone, the no-WebGL
# fallback). Pull requests build and test; main also deploys, only once both pass.
# (Settings → Pages → Source is "GitHub Actions": Pages no longer builds the branch itself.)
name: Site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }} # never cut a deploy off halfway

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Bundle the scripts
        run: npm ci --no-audit --no-fund && npm run build
      - name: Build
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
          # jekyll-github-metadata asks the API for repo details; the token keeps it under the limit
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check links and assets
        run: node tools/check-site.mjs _site
      - uses: actions/upload-pages-artifact@v3

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
      - run: mkdir _site && tar -xf artifact.tar -C _site
      - name: The wardrobe's data and MCP server, on the real schema
        run: node tools/wardrobe-test.mjs
      - name: Trips in detail, on the real schema
        run: node tools/trips-test.mjs
      - name: Smoke test
        run: node tools/smoke.mjs _site
      - if: failure() # what the page looked like when it failed
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failed
          path: smoke-failed-*.png
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
