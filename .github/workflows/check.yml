# Builds the site the way GitHub Pages does and checks the result: every internal link and asset
# is there, and the homepage world's modules parse, resolve and are preloaded
# (tools/check-site.mjs). Runs on every pull request and on main. It doesn't deploy: Pages
# still builds and publishes from the branch.
name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
          # jekyll-github-metadata asks the API for repo details; the token keeps it under the limit
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check links and the world's modules
        run: node tools/check-site.mjs _site
