# The Supabase project, as code (supabase/, applied by tools/supabase.mjs).
# - deploy: on a merge that touches supabase/, applies new migrations and the auth settings,
#   copies ANTHROPIC_API_KEY into the project's function secrets, and deploys the functions
#   (supabase/functions/*). Needs the SUPABASE_ACCESS_TOKEN and ANTHROPIC_API_KEY repo
#   secrets; without the first the job says so and passes.
# - logs: run by hand with "logs" ticked, prints what the edge functions did lately
#   (tools/supabase-logs.mjs: paths and statuses only) and changes nothing.
# - keepalive: hourly. Asks the public API for something, since free projects pause after a week
#   without requests (the anon key from _config.yml; no secret needed); empties the wardrobe's
#   trash, what was deleted over 30 days ago (tools/empty-trash.mjs); and makes the smaller copies
#   of new photos for the MCP server (tools/photo-copies.mjs; also after each deploy). The last two
#   need SUPABASE_ACCESS_TOKEN and are skipped without it.
name: Supabase

on:
  push:
    branches: [main]
    paths: [supabase/**, tools/supabase.mjs, .github/workflows/supabase.yml]
  schedule:
    - cron: '23 * * * *' # hourly: new photos' copies (cheap when there are none); keepalive and the trash ride along
  workflow_dispatch:
    inputs:
      logs:
        description: Only print the edge functions' recent logs (changes nothing)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'schedule' && !inputs.logs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Token?
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::No SUPABASE_ACCESS_TOKEN secret, so nothing was applied."
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok
        with:
          node-version: 22
      - name: Apply migrations and auth settings
        if: steps.token.outputs.ok
        run: node tools/supabase.mjs
      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.ok
        with:
          version: 2.118.0
      - name: Function secrets and deploy
        if: steps.token.outputs.ok
        run: |
          ref=$(sed -n 's|^  url: *https://\([a-z0-9]*\)\.supabase\.co.*|\1|p' _config.yml)
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            supabase secrets set --project-ref "$ref" ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"
          else
            echo "::warning::No ANTHROPIC_API_KEY secret; the bartender will answer that the bar's closed."
          fi
          for f in supabase/functions/*/index.ts; do
            name=$(basename "$(dirname "$f")")
            # these check who's calling themselves: the MCP server's OAuth discovery comes without
            # a token, and both take tokens from the newer signing keys
            case "$name" in mcp|wardrobe-link) flags=--no-verify-jwt ;; *) flags= ;; esac
            supabase functions deploy "$name" --project-ref "$ref" --use-api $flags
          done
      - name: Photo copies (vision and thumbnail sizes, for the MCP server)
        if: steps.token.outputs.ok
        run: |
          v=$(node -p "require('./package.json').devDependencies.imagescript")
          npm install --prefix "$RUNNER_TEMP/img" --no-save --no-audit --no-fund "imagescript@$v" >/dev/null
          IMAGESCRIPT="$RUNNER_TEMP/img/node_modules/imagescript" node tools/photo-copies.mjs

  logs:
    if: inputs.logs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/supabase-logs.mjs 3

  keepalive:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.logs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ask the API for something
        run: |
          url=$(sed -n 's/^  url: *//p' _config.yml)
          key=$(sed -n 's/^  anon_key: *//p' _config.yml)
          curl -fsS "$url/rest/v1/bottles?select=id&limit=1" -H "apikey: $key" -o /dev/null
          echo "Supabase answered."
      - name: Empty the trash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "No SUPABASE_ACCESS_TOKEN: skipped."; exit 0; fi
          node tools/empty-trash.mjs
      - name: Photo copies
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "No SUPABASE_ACCESS_TOKEN: skipped."; exit 0; fi
          v=$(node -p "require('./package.json').devDependencies.imagescript")
          npm install --prefix "$RUNNER_TEMP/img" --no-save --no-audit --no-fund "imagescript@$v" >/dev/null
          IMAGESCRIPT="$RUNNER_TEMP/img/node_modules/imagescript" node tools/photo-copies.mjs
