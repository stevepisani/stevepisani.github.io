# Makes the real 3D models for the things on friends' planets (tools/planet-models.mjs: Meshy, from
# the words in each thing's `model`) and commits them to the branch it ran on. Here because it
# needs the MESHY_API_KEY repo secret, and the Claude sandbox can't reach Meshy. It runs whenever
# a planet's spec changes on a branch other than main, or by hand (with `redo`: slug/id,
# comma-separated). Meshy credits are spent only on what's missing, capped in the tool (8 models a
# planet, 24 a run).
name: Planet models

on:
  push:
    branches-ignore: [main]
    paths: [tools/models/planets/**, tools/planet-models.mjs, supabase/functions/planets/server.js]
  workflow_dispatch:
    inputs:
      redo:
        description: Models to make again (slug/id, comma-separated)
        required: false
      styles:
        description: Draw the house-style samples instead (tools/planet-styles.mjs)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: planet-models-${{ github.ref }}

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Make what's missing
        id: make
        continue-on-error: true
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
        run: |
          if [ "${{ inputs.styles }}" = "true" ]; then node tools/planet-styles.mjs; else node tools/planet-models.mjs --redo "${{ inputs.redo }}"; fi
      # whatever was made, even when something failed (a re-run picks up from the manifest). Push
      # again after it: a commit by this workflow doesn't start the Site checks.
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/planets tools/models/planets
          git diff --cached --quiet || { git commit -m "Models for friends' planets (tools/planet-models.mjs)" && git push; }
      - if: steps.make.outcome != 'success'
        run: exit 1
