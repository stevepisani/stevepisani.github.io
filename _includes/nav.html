<header class="site-head">
  <div class="wrap site-head__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/sj-64.png' | relative_url }}" alt="" width="28" height="28">
      <span>Steve Pisani</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      {%- assign here = page.url | remove: '.html' -%}
      <a href="{{ '/about' | relative_url }}" {% if here == '/about' %}aria-current="page"{% endif %}>About</a>
      <a href="{{ '/blog' | relative_url }}" {% if here == '/blog' or page.layout == 'post' %}aria-current="page"{% endif %}>Writing</a>
      <a href="{{ '/lab' | relative_url }}" {% if here == '/lab' %}aria-current="page"{% endif %}>Lab</a>
      <a href="{{ '/bookshelf' | relative_url }}" {% if here == '/bookshelf' %}aria-current="page"{% endif %}>Books</a>
      {%- comment %} shown by site.js to someone signed in to the private apps on this browser {% endcomment %}
      <a href="{{ '/apps/' | relative_url }}" data-members hidden {% if page.layout == 'app' %}aria-current="page"{% endif %}>Apps</a>
      <a href="{{ site.links.resume }}" target="_blank" rel="noopener">Resume ↗</a>
    </nav>
    <button id="theme" class="theme-btn" type="button" aria-label="Change theme" title="Change theme">
      <span class="theme-btn__icon" aria-hidden="true"></span>
    </button>
  </div>
</header>
