<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  {% include head.html %}
  <script>document.documentElement.dataset.theme = 'dark';</script>
  <link rel="stylesheet" href="{{ '/assets/css/bar.css' | relative_url }}">
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js">
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    } }
  </script>
</head>
<body class="bar-page">
  <a class="skip-link" href="#bar-menu">Skip to the menu</a>
  {% include nav.html %}
  <main id="main">
    {{ content }}
  </main>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  <script type="module" src="{{ '/assets/js/bar/main.js' | relative_url }}"></script>
</body>
</html>
