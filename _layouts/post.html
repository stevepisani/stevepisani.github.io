---
layout: default
---
<article class="wrap post">
  <header class="post-head">
    <p class="kicker"><a href="{{ '/blog' | relative_url }}">← Writing</a></p>
    <h1>{{ page.title }}</h1>
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      · {% include read_time.html %} read
    </p>
  </header>
  {% include cover.html item=page %}
  <div class="prose">
    {{ content }}
  </div>
  <footer class="post-foot">
    <p>Thoughts? Disagree about leading commas? <a href="mailto:{{ site.email }}?subject={{ page.title | uri_escape }}">Email me</a>.</p>
  </footer>
</article>
