<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  {% include head.html %}
  <script>document.documentElement.dataset.theme = 'dark';</script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Caveat:wght@500&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/world.css' | relative_url }}">
  <link rel="preload" href="{{ '/assets/models/props.glb' | relative_url }}" as="fetch" type="model/gltf-binary" crossorigin>
  <!-- The whole world, three.js included, is one minified file (npm run build, tools/build-js.mjs) -->
  <link rel="modulepreload" href="{{ '/assets/js/dist/world.js' | relative_url }}">
</head>
<body class="world-page">
  <a class="skip-link" href="#topbar">Skip to the sections</a>
  <main id="main">
    {{ content }}
  </main>
  <script src="{{ '/assets/js/dist/site.js' | relative_url }}" defer></script>
  <script type="module" src="{{ '/assets/js/dist/world.js' | relative_url }}" data-models="{{ '/assets/models/props.glb' | relative_url }}"></script>
</body>
</html>
