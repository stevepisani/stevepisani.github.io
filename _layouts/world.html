<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  {% include head.html %}
  <script>document.documentElement.dataset.theme = 'dark';</script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/world.css' | relative_url }}">
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js">
  <link rel="preload" href="{{ '/assets/models/props.glb' | relative_url }}" as="fetch" type="model/gltf-binary" crossorigin>
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
        "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
        "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.39.5/build/index.js",
        "n8ao": "https://cdn.jsdelivr.net/npm/n8ao@2.0.1/dist/N8AO.js"
    } }
  </script>
</head>
<body class="world-page">
  <a class="skip-link" href="#topbar">Skip to the sections</a>
  <main id="main">
    {{ content }}
  </main>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  <script type="module" src="{{ '/assets/js/world/main.js' | relative_url }}" data-models="{{ '/assets/models/props.glb' | relative_url }}"></script>
</body>
</html>
