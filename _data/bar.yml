    drink: The Founder's Mai Tai
    what: About Steve
    href: /about
  - id: writing
    drink: Hot Takes on the Rocks
    what: Writing
    href: /blog
  - id: shelf
    drink: Top Shelf Neat
    what: The reading list
    href: /bookshelf
  - id: lab
    drink: Lab Experiment No. 9
    what: Things I'm building
    href: /lab
  - id: launch
    drink: The Liftoff
    what: Next rocket launch, live
    href: /classic
