# The asteroid homepage (index.html + assets/js/world/).

# The menu: at the bar, or from the Menu button anywhere. label is what people scan,
# so keep it plain; drink is flavour. Each item opens <template id="panel-<id>">;
# href is where the link goes without 3D (and for crawlers).

menu:
  - id: about
    label: About me
    drink: The Founder's Mai Tai
    href: /about
  - id: writing
    label: Writing
    drink: Hot Takes on the Rocks
    href: /blog
  - id: lab
    label: Projects
    drink: Lab Experiment No. 9
    href: /lab
  - id: shelf
    label: Reading list
    drink: Top Shelf, Neat
    href: /bookshelf
  - id: contact
    label: Contact
    drink: Tip the Bartender
    href: mailto:steve@stevenpisani.com
  - id: resume
    label: Résumé
    drink: Close Out the Tab
    href: https://drive.google.com/file/d/1PSHFaKjdJazFEeZS9YacD-J378TdJRBf/view?usp=sharing
  - id: launch
    label: Next rocket launch
    drink: The Liftoff
    href: /classic

# Things the robot bartender says while you're seated, in rotation.
bartender:
  - "Welcome to Steve's. Pick anything on the menu. It's on the house."
  - "I'm an AI. The pineapple shirt was his idea."
  - "There's a campfire around the back of the planet, if you're curious."
  - "The telescope out front is pointed at the next rocket launch."

# Shown at the campfire on the far side of the planet.
likes:
  - Technology, especially the kind that runs quietly in the background
  - My cat
  - All things energy
  - Rockets
  - Well-formatted SQL (leading commas, lowercase, fight me)
  - Arguing about where to get the best cheesesteak
