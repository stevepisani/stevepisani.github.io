# Favorite drinks and recipes: the chalkboard behind the bar, the "Favorite drinks" panel at
# the bar, and /drinks. Add, reorder or replace freely; the board shows the first six names.
#
#   name:    what it's called
#   origin:  where it comes from (optional)
#   glass:   what it's served in (optional)
#   build:   ingredients, one per line. Amounts in oz (½ ¼ ¾ ⅓ work) set how far each pour
#            fills the glass when the robot makes it
#            (a line naming Planteray, Campari, Chartreuse or Meletti / coffee liqueur is poured
#            from that real bottle, a hero model; the rest from a bottle tinted to match)
#   method:  how to make it
#   note:    anything else (optional)
#   make:    how the robot makes it at the bar ("Make me one"), step by step:
#     glass:   rocks | collins | coupe
#     ice:     cubes | crushed (none for a coupe)
#     color:   what's in the glass, a PALETTE key from assets/js/world/materials.js
#     foam:    a head on it, a PALETTE key (optional)
#     garnish: pineapple | orange | mint | beans, or a list of them
#     steps:   after it pours the build, one per line: shake | strain | stir | swizzle | garnish,
#              each with what the robot says it's doing. Pours go into a tin if there's a
#              shake, straight into the glass if not.

- name: Jungle Bird
  origin: Aviary Bar, Kuala Lumpur Hilton, 1978
  glass: Double old fashioned, over ice
  build:
    - 1½ oz Planteray 20th Anniversary rum
    - ¾ oz Campari
    - 1½ oz pineapple juice
    - ½ oz fresh lime juice
    - ½ oz demerara syrup
  method: Shake with ice and strain over fresh ice. Garnish with a pineapple wedge.
  make:
    glass: rocks
    ice: cubes
    color: jungleBird
    garnish: pineapple
    steps:
      - shake: Shake it hard with ice.
      - strain: Strain it over fresh ice.
      - garnish: A pineapple wedge on the rim.

- name: Chartreuse Swizzle
  origin: Marcovaldo Dionysos, San Francisco, early 2000s
  glass: Collins glass, crushed ice
  build:
    - 1¼ oz green Chartreuse
    - 1 oz pineapple juice
    - ¾ oz fresh lime juice
    - ½ oz velvet falernum
  method: Build over crushed ice and swizzle until the glass frosts. Top with more crushed ice, and garnish with a sprig of mint and a little grated nutmeg.
  make:
    glass: collins
    ice: crushed
    color: chartreuse
    garnish: mint
    steps:
      - swizzle: Swizzle it until the glass frosts over.
      - garnish: More crushed ice, a sprig of mint, a little nutmeg.

- name: Shakerato
  origin: Italy's espresso bars
  glass: Chilled coupe
  build:
    - 2 oz fresh espresso (a double shot)
    - ¾ oz Meletti coffee liqueur
  method: Shake hard with ice until it foams, and strain into a chilled coupe. The crema shakes up into a thick head.
  note: A bar spoon of simple syrup if you like it sweeter.
  make:
    glass: coupe
    color: espresso
    foam: crema
    steps:
      - shake: Shake it hard, until it foams.
      - strain: Strain it into the coupe.

- name: Il Professore
  origin: Antonio at the Grand Hotel Vesuvio, Naples
  glass: Old fashioned, over ice
  build:
    - 1 oz gin
    - 1 oz Campari
    - 1 oz sweet vermouth
    - ⅓ oz coffee liqueur (a small-batch Italian one if you can find it; Kahlúa is fine)
  method: Combine in an old-fashioned glass filled with ice and stir. Garnish with an orange slice and a few coffee beans.
  note: A Negroni with a touch of coffee liqueur, from Antonio, the barman in the hotel's lobby.
  make:
    glass: rocks
    ice: cubes
    color: negroni
    garnish: [orange, beans]
    steps:
      - stir: Stir it over the ice.
      - garnish: An orange slice and a few coffee beans.

# From my old homebar notes (stevepisani/homebar, recipes/signatures/).
# Short names first: the bar's chalkboard shows the first six drinks.

- name: OG Hurricane
  origin: The original New Orleans Hurricane, not the neon syrup version
  glass: Hurricane glass or tiki mug, crushed ice
  build:
    - 2 oz dark rum
    - 2 oz light rum
    - 1 oz passion fruit syrup
    - 1 oz fresh orange juice
    - ½ oz fresh lime juice
    - ½ oz rich simple syrup
  method: Shake all the ingredients hard with ice. Strain into a Hurricane glass (or tiki mug) over crushed ice. Garnish with an orange wheel, a cherry, or dehydrated citrus.
  note: A serious rum drink, not a Bourbon Street sugar bomb. Passion fruit is the key, so quality matters (Funkin or Liber & Co), and adjust the syrup to its sweetness. Use two rums, not one; I like Appleton or Smith & Cross with Plantation 3 Stars. Batches well for parties without ice; pour over crushed ice to serve.
  make:
    glass: collins
    ice: crushed
    color: orange
    garnish: orange
    steps:
      - shake: Shake it hard with ice.
      - strain: Strain it over crushed ice.
      - garnish: An orange wheel.

- name: House Tiki
  origin: My tiki template, a Mai Tai skeleton that flexes with whatever rums are open
  glass: Tiki mug, crushed ice
  build:
    - 1½ oz aged or Jamaican rum
    - ¾ oz light rum or rhum agricole
    - ¾ oz fresh lime juice
    - ½ oz orgeat
    - ½ oz orange liqueur
    - ¼ oz rich simple syrup (adjust to taste)
    - ¼ oz allspice dram or falernum (optional)
  method: Shake with ice. Strain into a tiki mug over crushed ice. Garnish with a mint sprig, dehydrated lime, or whatever's appropriate.
  note: "For when I want tiki but don't want to follow a recipe, or I'm trying new rums or clearing bottles. Pairings I like: Smith & Cross with Plantation 3 Stars (funky, bold), Appleton Estate with rhum agricole (balanced, grassy), El Dorado 8 with Probitas (rich, smooth), Plantation OFTD with Denizen White (heavy, complex)."
  make:
    glass: collins
    ice: crushed
    color: rum
    garnish: mint
    steps:
      - shake: Shake it with ice.
      - strain: Strain it over crushed ice.
      - garnish: A sprig of mint.

- name: Coffee-Pineapple Boulevardier
  origin: My signature riff on the Boulevardier, with house-infused Camparis
  glass: Rocks glass, large cube
  build:
    - 1½ oz bourbon
    - ¾ oz coffee-infused Campari
    - ¾ oz sweet vermouth
  method: Stir with ice until well-chilled. Strain into a rocks glass over a large cube. Garnish with an orange peel, expressed.
  note: For the coffee Campari, steep coffee beans in Campari for 24 to 48 hours. The coffee adds a roasty depth that suits bourbon, and a barspoon of pineapple Campari bridges bitter and tropical. My defaults are Buffalo Trace or Wild Turkey 101, and Carpano Antica Formula.
  make:
    glass: rocks
    ice: cubes
    color: negroni
    garnish: orange
    steps:
      - stir: Stir it over the ice until it's well chilled.
      - garnish: An orange peel, expressed.

- name: Clarified Jungle Bird
  origin: My favorite party batch, milk-clarified
  glass: Coupe, served up (or a rocks glass with a large cube)
  build:
    - 1½ oz dark Jamaican rum
    - ¾ oz Campari
    - 1½ oz pineapple juice
    - ½ oz fresh lime juice
    - ½ oz rich simple syrup
  method: "Batch eight servings (12 oz rum, 6 oz Campari, 12 oz pineapple juice, 4 oz lime juice, 4 oz rich simple syrup), taste, and adjust; it should be slightly concentrated. Pour the mix into 8 oz of room-temperature whole milk (not the reverse) and let it curdle in the fridge for 1 to 2 hours. Strain through cheesecloth or a nut milk bag, re-strain the first runoff for clarity, then bottle and refrigerate. Add 15 to 20% water if serving up, and pour 4 oz per glass; no shaking needed."
  note: All the Jungle Bird flavor, crystal clear with a silky texture; the milk takes the harshness out. Keeps 2 to 3 weeks in the fridge. Garnish with dehydrated pineapple, or nothing; the clarity is the visual.
  make:
    glass: coupe
    color: falernum
