# "Rockets and Horses": the stops of the walk along one track, in the order you walk them
# (back in time from today's rails to Rome, then forward to the Shuttle). Used by the post's
# walk (_includes/gauge-walk.html, assets/js/walk/gauge.js) and the planet's flatcar panel.
#   scene    which set the 3D walk shows (gauge.js SCENES)
#   when     where and when, a kicker
#   title    a few words for the stop (the planet's panel lists them)
#   story    what happened, as best it's known (Snopes, "Railroad Gauge and Roman Chariots";
#            the Rogers Commission report for the boosters)
#   legend   optional: what the internet version says instead
- scene: rails
  when: United States, today
  title: Standard gauge
  story: Almost every mile of American track is 4 feet 8½ inches between the rails. It wasn't settled without a fight. In 1863 Lincoln picked 5 feet for the transcontinental railroad, and Congress overruled him. In 1886 the South gave in too. Over two days, crews shifted one rail on more than 11,000 miles of track.
  legend: English expatriates built America's railroads. Really, early lines bought English locomotives, like the John Bull, and laid track to fit them.
- scene: locomotive
  when: England, 1825–1846
  title: Stephenson's gauge
  story: George Stephenson built his railways to the gauge of the coal wagonways he grew up around, 4 feet 8 inches, then added half an inch of play. In 1829 his Rocket won the trials to run on one of them. Brunel tried 7 feet on the Great Western, and lost. In 1846 Parliament made Stephenson's gauge the rule for new lines.
- scene: tram
  when: Northumberland, the 1700s
  title: Wagonways
  story: Before steam, horses hauled coal from the pits down to the river in wagons on wooden rails. The wagons were built like farm carts, as wide as one horse could pull, and every colliery chose its own spacing.
- scene: wagon
  when: England, the Middle Ages
  title: Ruts
  story: Wheels cut ruts into dirt roads, and a cart that didn't match them had a rough ride. But no rut was standard. Carts were as wide as their horse and their builder made them, and the width changed from one county to the next.
  legend: Any other spacing would snap an axle in the old Roman ruts.
- scene: ruts
  when: The Roman Empire
  title: Roman roads
  story: Rome did build Britain's first long paved roads, and Roman wheels did wear grooves into stone. You can still see them in Pompeii, roughly as far apart as modern rails. They were made by carts and wagons hauling goods. The legions walked.
  legend: The ruts were made by Roman war chariots.
- scene: horses
  when: Rome
  title: Two horses
  story: Rome's army didn't fight from chariots; Rome raced them. Two-horse chariots ran the Circus Maximus in front of 150,000 people or more. Horses set the width, not Romans. Anything built to be pulled by a horse or two ends up about this wide, in Rome, in Northumberland, anywhere.
  legend: The chariots were sized for the back ends of two war horses, and everything after copied them.
- scene: booster
  when: Utah, the 1980s
  title: The booster
  story: Thiokol built the Shuttle's solid rocket boosters in Utah and sent them to Florida by train, in segments about 12 feet across. Going by rail is a big part of why they came in pieces. The joints between those pieces held the O-rings that failed on Challenger in 1986.
  legend: A tunnel only a little wider than the track set the boosters' size.
- scene: shuttle
  when: Florida, 1981
  title: Liftoff
  story: Columbia lifted off on April 12, 1981, on two boosters that had ridden the rails from Utah. A horse didn't size the Space Shuttle. But rails laid out for horse-drawn coal wagons carried its boosters, and shipping by rail shaped how they were built.
