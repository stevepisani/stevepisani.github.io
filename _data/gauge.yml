# "Rockets and Horses": the stops of the walk along one track, in the order you walk them
# (back in time from today's rails to Rome, then forward to the Shuttle). Used by the post's
# walk (_includes/gauge-walk.html, assets/js/walk/gauge.js) and the planet's flatcar panel.
#   scene    which set the 3D walk shows (gauge.js SCENES)
#   when     where and when, a kicker
#   title    a few words for the stop (the planet's panel lists them)
#   story    what happened, as best it's known (Snopes, "Railroad Gauge and Roman Chariots";
#            the Rogers Commission report for the boosters)
#   legend   optional: what the internet version says, shown first; the story answers it
#   measure  what the brass measure across the way says at this stop (the scene's corner)
#   gauge    the width it measures, in inches (the rails, or the ruts the wheels run in;
#            several: more ruts side by side, the cart in the first). 56.5 if left out.
- scene: rails
  when: United States, today
  title: Standard gauge
  measure: 4′ 8½″
  legend: English expatriates built America's railroads, so they used England's gauge.
  story: Close. Early lines bought English engines, like the John Bull, and laid track to fit them. Plenty of others didn't, and it took a fight to settle. Congress overruled Lincoln's 5 feet in 1863. In 1886 the South moved one rail on 11,000 miles of track in two days, to 4 feet 9 inches, near enough to share cars.
- scene: locomotive
  when: England, 1825–1846
  title: Stephenson's gauge
  measure: 4′ 8″, then ½″ more
  story: George Stephenson laid his railways to the gauge of the coal wagonways he grew up around, 4 feet 8 inches, then added half an inch of play. In 1829 the Rocket, built by his son Robert, won the trials to run on one of them. Brunel tried 7 feet on the Great Western, and lost. In 1846 Parliament made Stephenson's gauge the rule for new lines.
- scene: tram
  when: Northumberland, the 1700s
  title: Wagonways
  measure: 4′ 8″ at Killingworth
  gauge: 56
  story: Before steam, horses hauled coal from the pits down to the river in wagons on wooden rails. Each wagon was built for one horse to pull, and each colliery chose its own spacing. Killingworth, where Stephenson worked, used 4 feet 8 inches.
- scene: wagon
  when: England, the Middle Ages
  title: Ruts
  measure: No standard
  gauge: 46 64
  legend: Any other spacing would snap an axle in the old Roman ruts.
  story: Wheels did cut ruts into dirt roads, and a cart that didn't fit them had a rough ride. But no rut was standard. A cart was as wide as its horse and its builder made it, and the width changed from county to county.
- scene: ruts
  when: The Roman Empire
  title: Roman ruts
  measure: About as wide
  gauge: 57
  legend: The ruts were made by Roman war chariots.
  story: Roman wheels did wear grooves into stone. You can still see them in Pompeii's streets, roughly as far apart as modern rails. Carts and wagons hauling goods cut them, not chariots. The legions walked, and most of the roads Rome built in Britain were gravel.
- scene: horses
  when: Rome
  title: Chariots
  measure: Two horses wide
  gauge: 57
  legend: The chariots were sized for the back ends of two war horses, and everything after copied them.
  story: Rome's army didn't fight from chariots; Rome raced them, in front of 150,000 people or more at the Circus Maximus. The big races ran four horses, the junior ones two. Horses set the width, not Romans. Anything built for a horse or two to pull ends up about this wide, in Rome, in Northumberland, anywhere.
- scene: booster
  when: Utah, the 1980s
  title: The booster
  measure: 4′ 8½″
  legend: A tunnel only a little wider than the track set the boosters' size.
  story: Forward 2,000 years. Thiokol built the Shuttle's solid rocket boosters in Utah and sent them to Florida by train, in segments about 12 feet across. Rail is a big part of why they came in pieces. The joints between those pieces held the O-rings that failed on Challenger in 1986.
- scene: shuttle
  when: Florida, 1981–2011
  title: Liftoff
  measure: 4′ 8½″
  story: The Shuttle flew 135 times. Every flight rode on boosters that had come from Utah by rail, in pieces made to fit the trip, on rails first laid out for horse-drawn coal wagons.
